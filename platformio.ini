; ============================================================
;  platformio.ini – KIRBY project configuration
;  Board: ESP32 DevKit V1
; ============================================================

; Project paths belong in the [platformio] section,
; NOT in [env:...] !
[platformio]
src_dir     = firmware/esp32/src
include_dir = firmware/esp32/include

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags   = -I firmware/esp32/include

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
