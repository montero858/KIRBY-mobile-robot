; PlatformIO Project Configuration File
;
; ============================================================
;  platformio.ini - KIRBY Projektkonfiguration
;  Board: ESP32 DevKit V1
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; WiFi.h, WebServer.h und Wire.h sind im ESP32-Arduino-Core
; bereits enthalten und muessen hier nicht aufgefuehrt werden.
; WiFiControl.h liegt im lib/-Ordner und wird automatisch erkannt.
lib_deps =
    https://github.com/mrRobot62/Arduino-ultrasonic-SR04-library.git
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9